[project]
name = "casavaiano"
version = "0.1.0"
description = "Guest-inquiry assistant for a Tuscan agriturismo: LangGraph agent, RAG, tool calling and evals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "langfuse>=5.2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casavaiano"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real external APIs (deselected by default)",
    "embedding: uses the local embedding model (downloads it on first run)",
]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-m 'not live'"
