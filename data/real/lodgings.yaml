# The real CasaVaiano apartments, in Slope's order. Facts as Tommaso describes them (Italian;
# the assistant translates). Availability comes from one Slope iCal per apartment
# (CASA_ICAL_<NAME> in .env, never committed). Every apartment has a double bed and a double
# sofa bed (4 people) and can take one extra single bed (5 people), confirmed by Tommaso 2026-11-18.
lodgings:
  - name: Capanna
    size_m2: 45
    capacity: 5
    standard_guests: 4
    facts: "il più costoso ed esclusivo: indipendente, al piano terra, con terrazza, vicino al parcheggio e alla piscina"
  - name: Girasole
    size_m2: 50
    capacity: 5
    standard_guests: 4
    facts: "l'unico con l'aria condizionata; al piano terra, con il divano letto in un soppalco e terrazza privata"
